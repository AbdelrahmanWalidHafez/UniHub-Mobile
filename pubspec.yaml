name: unihub_mobile
description: "UniHub Mobile Application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  http: ^1.1.0
  flutter_secure_storage: ^9.0.0
  jwt_decoder: ^2.0.1
  provider: ^6.1.1
  image_picker: ^1.0.5
  path: ^1.9.0
  http_parser: ^4.0.2
  file_picker: ^8.0.5
  url_launcher: ^6.2.5
  record: ^5.0.0
  path_provider: ^2.1.0
  flutter_markdown: ^0.6.18
  web_socket_channel: ^2.4.0
  socket_io_client: ^2.0.3
  audioplayers: ^6.0.0
  json_annotation: ^4.8.1
  stomp_dart_client: ^0.4.1
  google_fonts: ^6.1.0
  permission_handler: ^11.0.0
  webview_flutter: ^4.4.0
  webview_flutter_android: ^3.12.0
  webview_flutter_wkwebview: ^3.9.0
  clipboard: ^0.1.3
  intl: ^0.18.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/background2.jpeg
    - assets/images/classroom/class_1.jpg
    - assets/images/classroom/class_2.jpg
    - assets/images/classroom/class_3.jpg
    - assets/images/classroom/class_4.jpg
    - assets/images/classroom/class_5.jpg
    - assets/images/classroom/class_6.jpg
    - assets/images/classroom/class_7.jpg
    - assets/images/classroom/class_8.jpg
    - assets/images/classroom/class_9.jpg
    - assets/images/lumos_logo.png
    - assets/images/chat_background.png

  # FONTS REMOVED - use system default